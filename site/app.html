<script>
/* Entrance animations for every tab of the dashboard, played when a tab is opened (not on filter changes).

<script>

  /* 31 Oct (Umair): alternate codes of one part share one stock pool. Hovering any of them shows a single bar on the

    return { c, part: G.name, src: its.every(r => r.src === its[0].src) ? its[0].src : 'In-house + vendor', stock, vstock, need, days, out: isFinite(days) ? addWd(T, Math.floor(days)) : null, nx, nxd, how, lvl: gap ? 'bad' : days < 7 ? 'warn' : 'ok',

/* Part Compliance - Other Parts (31 Oct, Umair): vendor-supplied alternate codes are not Atlas production parts, so the table

  const tbl = (head, rows, o = {}) => `<div class="tbox"${o.h ? ` style="max-height:${o.h}px"` : ''}><table class="tb"><thead><tr>${head.map(h => `<th${h.n ? ' class="n"' : ''}>${esc(h.t)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  const td = (v, c) => `<td${c ? ` class="${c}"` : ''}>${v}</td>`;

  function skeleton(sec) {
    const w = document.createElement('div'); w.id = 'crb';
    w.innerHTML = `<div class="crbh"><h2>Budget Compliance</h2><span>Finance CR Summary Sheet 2026-27 (Annexure N budget and monthly actuals) · Rs per bike · actuals posted to ${M[LAST] || '—'} 26</span></div>
<div class="grid"><div class="card wide kpicard"><div class="crbk" id="crb-kpi"></div></div>
<div class="card wide"><h3>Cumulative CR · Budget vs Actual vs Forecast</h3><p class="crsub">Solid: Finance actual · dashed: Annexure N budget · dotted: actual plus the in-progress and pending ideas on this tab, by target month (the forecast follows the Shop, Category, Status, Target quarter and Source filters)</p><div class="crbleg" id="crb-leg"></div><div class="chart" id="crb-cum" style="min-height:260px"></div></div>
<div class="card wide"><h3>Monthly Budget vs Actual</h3><p class="crsub">Rs per bike by month · green = ahead of budget, red = behind</p><div id="crb-mon"></div></div>
<div class="card"><h3>By Activity Type</h3><p class="crsub">Finance's three budget heads · to date = Jul to ${M[LAST]}</p><div id="crb-cat"></div></div>
<div class="card"><h3>Shop × Model</h3><p class="crsub">From Finance's Plan vs Actual sheet (Q1). Its plan column mixes periods, see the errors below</p><div id="crb-shop"></div></div>
<div class="card wide"><h3>Achieved Activities (Finance)</h3><p class="crsub">What Finance has booked as actual savings, from the CR Activities Break Up sheet</p><div id="crb-brk"></div></div>
<div class="card wide"><h3>Budgeted Activities (Annexure N)</h3><p class="crsub">Every budget line with its month and Rs per bike · search to find one</p><input class="q" id="crb-q" placeholder="Search shop, activity, model or type" aria-label="Search budget lines"><div id="crb-lines"></div></div>
<div class="card wide" id="crb-gap"><h3>Gaps &amp; errors: Finance budget vs this tab<span class="pill warn">Temporary</span></h3><p class="crsub">Shown for review; to be removed once fixed</p><div id="crb-gapbody"></div></div></div>`;
    const tg = document.createElement('div'); tg.id = 'crb-tog'; tg.innerHTML = '<span class="crmt" role="group" aria-label="VA/CR view"><button type="button" data-v="bc">Budget Compliance</button><button type="button" data-v="cc">Cost Competitiveness</button></span>';
    tg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.v; window.__draw && window.__draw(); }));
    sec.insertBefore(w, sec.querySelector('.crhead') || sec.firstChild); w.querySelector('.crbh').appendChild(tg);
    const qi = w.querySelector('#crb-q'); qi.addEventListener('input', () => lines(qi.value));
    return w;
  }

  function kpis() {
    const el = document.getElementById('crb-kpi'); const tot = { b: 0, p: 0, a: 0 };
    const card = (name, b, p, a) => { const pr = pc(a, p), pf = pc(a, b); return `<div><div class="tl">${esc(name)}</div><div class="tv"${col(pr) ? ` style="color:${col(pr)}"` : ''}>${pr == null ? '—' : pr + '%'}</div><div class="ts">Actual Rs ${f2(a)} vs budget to date Rs ${f2(p)}</div><div class="ts">FY budget Rs ${f2(b)} · ${pf}% achieved · Rs ${f2(b - a)} left</div><div class="crbbar" title="Achieved vs full-year budget"><i style="width:${Math.min(100, pf)}%;background:${MC[name] || 'var(--navy)'}"></i><b style="left:${Math.min(100, p / b * 100)}%" title="Budget to date"></b></div></div>`; };
    el.innerHTML = MODS.map(m => { const b = d3.sum(PL[m]), p = sl(PL[m], LAST), a = sl(AC[m], LAST); tot.b += b; tot.p += p; tot.a += a; return card(m, b, p, a); }).join('') +
      `<div><div class="tl">October</div><div class="tv" style="color:var(--mut)">Not posted</div><div class="ts">October budget: ${MODS.map(m => m + ' ' + f2(PL[m][3])).join(' · ')}</div><div class="ts">${Math.round(MODS.reduce((s, m) => s + d3.sum(PL[m].slice(6)), 0) / tot.b * 100)}% of the year's budget falls in Jan–Jun</div></div>`;
  }

  function pipeline() {
    const r = dash.data('cr_ideas'); const out = {}; MODS.forEach(m => { out[m] = Array(12).fill(0); });
    if (!r || r.status !== 'ok') return out;
    const g = window.__P ? window.__P() : {}, p = dash.params() || {}, src = x => /VA\/CR sheet/.test(x.source) ? 'VA/CR sheets' : 'Shop CR plans';
    r.data.filter(x => (x.status === 'In Progress' || x.status === 'Pending') && (!g.shop || g.shop === 'All' || x.dash_shop === g.shop) && (!p.crcat || x.category === p.crcat) && (!p.crshop || x.shop === p.crshop)
      && (!p.crst || x.status === p.crst) && (!p.crq || x.quarter === p.crq) && (!p.crsrc || src(x) === p.crsrc)).forEach(x => {
      const [y, mo] = String(x.target || '').split('-').map(Number); if (!y) return; let i = (y - 2026) * 12 + mo - 7; if (i < 0 || i > 11) return; if (i <= LAST) i = LAST + 1; if (i > 11) return;
      const ms = MODS.includes(x.model) ? [x.model] : x.model === 'All models' ? MODS : []; ms.forEach(m => { out[m][i] += +x.cr_unit || 0; }); });
    return out;
  }

  function chart() {
    const el = document.getElementById('crb-cum'), lg = document.getElementById('crb-leg'); const W = Math.max(320, el.clientWidth || 800), H = 260, mg = { l: 40, r: 70, t: 10, b: 24 };
    const pipe = pipeline(); const S = MODS.map(m => { const pc_ = cum(PL[m]), ac = cum(AC[m]).slice(0, LAST + 1), pp = cum(pipe[m]); const fc = [ac[LAST]]; for (let i = LAST + 1; i < 12; i++) fc.push(ac[LAST] + pp[i]); return { m, pc: pc_, ac, fc }; });
    const ymax = d3.max(S, s => Math.max(d3.max(s.pc), d3.max(s.fc))) * 1.08;
    const x = d3.scalePoint().domain(M).range([mg.l, W - mg.r]), y = d3.scaleLinear().domain([0, ymax]).nice().range([H - mg.b, mg.t]);
    const svg = d3.create('svg').attr('width', W).attr('height', H).attr('role', 'img').attr('aria-label', 'Cumulative CR budget vs actual by model');
    svg.append('g').attr('transform', `translate(0,${H - mg.b})`).call(d3.axisBottom(x).tickSize(0)).call(g => g.select('.domain').attr('stroke', '#C9D1D9')).selectAll('text').attr('fill', '#5A6670').attr('font-size', 11);
    svg.append('g').attr('transform', `translate(${mg.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(W - mg.l - mg.r))).call(g => g.select('.domain').remove()).call(g => g.selectAll('line').attr('stroke', '#EEF1F4')).selectAll('text').attr('fill', '#5A6670').attr('font-size', 11);
    const ln = d3.line().x((d, i) => x(M[i])).y(d => y(d));
    S.forEach(s => { const c = MC[s.m];
      svg.append('path').attr('d', ln(s.pc)).attr('fill', 'none').attr('stroke', c).attr('stroke-width', 1.5).attr('stroke-dasharray', '5 4').attr('opacity', .8);
      svg.append('path').attr('d', d3.line().x((d, i) => x(M[i + LAST])).y(d => y(d))(s.fc)).attr('fill', 'none').attr('stroke', c).attr('stroke-width', 1.5).attr('stroke-dasharray', '1.5 3');
      svg.append('path').attr('d', ln(s.ac)).attr('fill', 'none').attr('stroke', c).attr('stroke-width', 2.5);
      s.ac.forEach((v, i) => svg.append('circle').attr('cx', x(M[i])).attr('cy', y(v)).attr('r', 3).attr('fill', c));
      svg.append('text').attr('x', W - mg.r + 6).attr('y', y(s.pc[11]) + 4).attr('font-size', 11).attr('fill', c).text(`${s.m} ${f2(s.pc[11])}`); });
    const hov = svg.append('rect').attr('x', mg.l).attr('y', mg.t).attr('width', W - mg.l - mg.r).attr('height', H - mg.t - mg.b).attr('fill', 'transparent');
    hov.on('mousemove', ev => { const [mx] = d3.pointer(ev); const i = Math.max(0, Math.min(11, Math.round((mx - mg.l) / ((W - mg.l - mg.r) / 11)))); tip.show(ev, [`${M[i]} ${i < 6 ? 26 : 27} · cumulative Rs per bike`, ...S.map(s => `${s.m}: budget ${f2(s.pc[i])}` + (i <= LAST ? ` · actual ${f2(s.ac[i])}` : ` · forecast ${f2(s.fc[i - LAST])}`))]); }).on('mouseleave', () => tip.hide());
    el.replaceChildren(svg.node());
    lg.innerHTML = MODS.map(m => `<span><i style="border-color:${MC[m]}"></i>${m}</span>`).join('') + '<span><i style="border-color:#5A6670;border-top-style:dashed"></i>Budget</span><span><i style="border-color:#5A6670"></i>Actual</span><span><i style="border-color:#5A6670;border-top-style:dotted"></i>Forecast</span>';
  }

  function monthly() {
    const rows = [];
    MODS.forEach(m => { rows.push(`<tr><td><b>${m}</b></td><td class="sub">Budget</td>${PL[m].map(v => td(v ? f2(v) : '·', 'n sub')).join('')}${td(f2(d3.sum(PL[m])), 'n')}</tr>`);
      rows.push(`<tr><td></td><td>Actual</td>${AC[m].map((v, i) => i > LAST ? td('—', 'n sub') : td(f2(v), 'n ' + (v >= PL[m][i] ? 'pos' : 'neg'))).join('')}${td(f2(d3.sum(AC[m])), 'n')}</tr>`); });
    document.getElementById('crb-mon').innerHTML = tbl([{ t: 'Model' }, { t: '' }, ...M.map(t => ({ t, n: 1 })), { t: 'FY', n: 1 }], rows);
  }

  function cats() {
    const rows = []; CATS.forEach(c => MODS.forEach((m, j) => { const b = d3.sum(D.plan[c][m]), p = sl(D.plan[c][m], LAST), a = sl(D.act[c][m], LAST), pr = pc(a, p);
      rows.push(`<tr>${td(j ? '' : '<b>' + esc(c) + '</b>')}${td(m)}${td(f2(b), 'n')}${td(f2(p), 'n')}${td(f2(a), 'n')}${td(pr == null ? (a ? 'no budget' : '—') : pr + '%', 'n ' + (pr == null ? '' : pr >= 100 ? 'pos' : 'neg'))}</tr>`); }));
    document.getElementById('crb-cat').innerHTML = tbl([{ t: 'Head' }, { t: 'Model' }, { t: 'FY budget', n: 1 }, { t: 'To date', n: 1 }, { t: 'Actual', n: 1 }, { t: 'vs plan', n: 1 }], rows);
  }

  function shops() {
    const by = d3.groups(D.spa, r => r.shop); const rows = [];
    by.forEach(([s, rs]) => { if (rs.every(r => !r.plan && !r.actual)) return; rs.forEach((r, j) => { const df = (r.actual || 0) - (r.plan || 0);
      rows.push(`<tr>${td(j ? '' : '<b>' + esc(s) + '</b>')}${td(r.model)}${td(f2(r.plan), 'n')}${td(f2(r.actual), 'n')}${td((df > 0 ? '+' : '') + f2(df), 'n ' + (df > 0.005 ? 'pos' : df < -0.005 ? 'neg' : ''))}</tr>`); }); });
    rows.push(`<tr class="tot"><td>Total</td><td></td><td></td><td></td><td></td></tr>`);
    document.getElementById('crb-shop').innerHTML = tbl([{ t: 'Shop' }, { t: 'Model' }, { t: 'Plan', n: 1 }, { t: 'Actual', n: 1 }, { t: 'Diff', n: 1 }], rows.slice(0, -1), { h: 420 });
  }

  function brk() {
    const rows = D.brk.map(r => `<tr>${td(esc(r.shop))}${td(esc(r.activity))}${['CD70', 'CG125', 'Pridor'].map(m => td(r[m] ? f2(r[m]) : '—', 'n')).join('')}</tr>`);
    rows.push(`<tr class="tot">${td('Total')}${td('')}${MODS.map(m => td(f2(sl(AC[m], 11)), 'n')).join('')}</tr>`);
    document.getElementById('crb-brk').innerHTML = tbl([{ t: 'Shop' }, { t: 'Activity' }, { t: 'CD70', n: 1 }, { t: 'CG125', n: 1 }, { t: 'Pridor', n: 1 }], rows);
  }

  function lines(q) {
    q = (q || '').toLowerCase(); const ls = D.lines.filter(l => !q || [l.shop, l.desc, l.model, l.type].join(' ').toLowerCase().includes(q));
    const rows = ls.map(l => `<tr>${td(esc(l.shop))}${td(esc(l.desc))}${td(l.model)}${td(esc(l.type))}${l.months.map((v, i) => td(v ? f2(v) : '', 'n' + (i <= LAST ? '' : ' sub'))).join('')}${td(f2(l.total), 'n')}</tr>`);
    rows.push(`<tr class="tot">${td(ls.length + ' lines')}${td('')}${td('')}${td('')}${M.map((m, i) => td(f2(d3.sum(ls, l => l.months[i])), 'n')).join('')}${td(f2(d3.sum(ls, l => l.total)), 'n')}</tr>`);
    document.getElementById('crb-lines').innerHTML = tbl([{ t: 'Shop' }, { t: 'Activity' }, { t: 'Model' }, { t: 'Type' }, ...M.map(t => ({ t, n: 1 })), { t: 'Total', n: 1 }], rows, { h: 460 });
  }

  function gaps() {
    const el = document.getElementById('crb-gapbody'); const ms = d3.sum(D.missing, r => r.rs), tb = MODS.reduce((s, m) => s + d3.sum(PL[m]), 0);
    const byShop = d3.rollups(D.missing, v => d3.sum(v, r => r.rs), r => r.shop).sort((a, b) => b[1] - a[1]);
    const sev = s => `<span class="pill ${s === 'High' ? 'bad' : s === 'Medium' ? 'warn' : 'neu'}">${s}</span>`;
    const typ = t => `<span class="pill ${t === 'Not budgeted' ? 'neu' : t === 'Status' ? 'bad' : 'warn'}">${t}</span>`;
    el.innerHTML = `<div class="crbk" style="margin:4px 0 6px"><div><div class="tl">Budget with no idea on this tab</div><div class="tv" style="color:#B02622">Rs ${f2(ms)}</div><div class="ts">${Math.round(ms / tb * 100)}% of the Rs ${f2(tb)} budget · ${D.missing.length} lines</div></div>
<div><div class="tl">Mismatches</div><div class="tv" style="color:#B07A00">${D.mismatch.filter(r => r.type !== 'Not budgeted').length}</div><div class="ts">model, value or status differs between Finance and this tab</div></div>
<div><div class="tl">Ideas with no budget line</div><div class="tv">${D.mismatch.filter(r => r.type === 'Not budgeted').length}</div><div class="ts">savings Finance did not plan for</div></div>
<div><div class="tl">Errors in the Finance sheet</div><div class="tv" style="color:#B02622">${D.errors.length}</div><div class="ts">${D.errors.filter(e => e.sev === 'High').length} high · ${D.errors.filter(e => e.sev === 'Medium').length} medium</div></div></div>
<h4>1. Budget lines with no matching idea on this tab</h4><p class="crsub">${byShop.map(([s, v]) => esc(s) + ' Rs ' + f2(v)).join(' · ')}</p>
${tbl([{ t: 'Shop' }, { t: 'Budgeted activity' }, { t: 'Model' }, { t: 'Type' }, { t: 'Month' }, { t: 'Rs / bike', n: 1 }], D.missing.slice().sort((a, b) => b.rs - a.rs).map(r => `<tr>${td(esc(r.shop))}${td(esc(r.activity))}${td(r.model)}${td(esc(r.type))}${td(esc(r.when))}${td(f2(r.rs), 'n')}</tr>`), { h: 380 })}
<h4>2. Same activity, different model, value or status</h4><p class="crsub">Finance (Annexure N / actuals) against the idea on this tab</p>
${tbl([{ t: 'Type' }, { t: 'Shop' }, { t: 'Activity' }, { t: 'Finance' }, { t: 'This tab' }, { t: 'Gap' }], D.mismatch.map(r => `<tr><td>${typ(r.type)}</td>${td(esc(r.shop))}${td(esc(r.item))}${td(esc(r.finance))}${td(esc(r.dashboard))}${td(esc(r.gap))}</tr>`), { h: 460 })}
<h4>3. Errors inside the Finance workbook</h4><p class="crsub">CR_Summary_Sheet_2026-27.xlsx · visible sheets only</p>
${tbl([{ t: 'Severity' }, { t: 'Sheet' }, { t: 'Where' }, { t: 'Shows' }, { t: 'Should be / why' }], D.errors.map(e => `<tr><td>${sev(e.sev)}</td>${td(esc(e.sheet))}${td(esc(e.where))}${td(esc(e.shows))}${td(esc(e.should))}</tr>`))}
<p class="crbnote">Also missing on this tab: no idea has an owner, and 67 of 73 have no investment figure.</p>`;
  }

  let done = 0, lastW = 0, mode = 'cc', lastPage = null; /* Cost Competitiveness (the ideas visuals) is the default each time the tab is opened */
  function applyMode(sec) { sec.classList.toggle('crb-on', mode === 'bc');
    { const tg = document.getElementById('crb-tog'), home = mode === 'bc' ? document.querySelector('#crb .crbh') : sec.querySelector('.crhead'); if (tg && home && tg.parentNode !== home) home.appendChild(tg); } /* buttons sit at the right end of whichever page title is showing */ document.querySelectorAll('#crb-tog button').forEach(b => { const on = b.dataset.v === mode; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); }
  function render() {
    const sec = document.getElementById('savings'); if (!sec || !document.getElementById('cr-bar')) return;
    let w = document.getElementById('crb'); if (!w) { w = skeleton(sec); done = 0; }
    applyMode(sec); if (mode !== 'bc') return;
    if (!done) { kpis(); monthly(); cats(); shops(); brk(); lines(''); gaps(); done = 1; }
    document.querySelectorAll('#cr-metric button').forEach(b => { b.disabled = true; b.title = 'Budget Compliance is in Rs per bike; these measures apply to Cost Competitiveness'; });
    const fk = JSON.stringify([dash.params(), window.__P ? window.__P().shop : '']), cw = document.getElementById('crb-cum').clientWidth; if (cw !== lastW || fk !== render._fk || !document.querySelector('#crb-cum svg') || render._ideas !== (dash.data('cr_ideas') || {}).data) { lastW = cw; render._fk = fk; render._ideas = (dash.data('cr_ideas') || {}).data; chart(); }
  }
  const od = window.__draw; window.__draw = function () { const r = od && od.apply(this, arguments); try { if (window.__page === 'savings') { if (lastPage !== 'savings') mode = 'cc'; render(); } lastPage = window.__page; } catch (e) { console.warn('crb', e); } return r; };
  if (window.__page === 'savings') { lastPage = 'savings'; render(); }
})();

</script>
<script>
/* Closing Stock tab (renamed from Opening Stock, 31 Oct, Umair; tab id stays "openstock" so user tab ticks keep working): stock read from the Atlas stock feed for every Atlas portal code plus every MB52 code.
   Shown to everyone in the Claude artifact; on the portal, to whoever has the "Opening Stock" tab ticked in Users.
   OS.blob is the uploaded snapshot (row layout above toRow); OS.at is when it was read.
   OS.trial marks a temporary trial read that Umair will ask to remove before the 23:30 snapshot. */
(() => {
  const OS = { blob: 'fdcd117288c0da1d2b011c410da43aff', at: '31 Oct 23:57, after the 23:30 refresh', trial: false, label: 'Oct 2026 closing stock' };
  const nf = d3.format(',.0f'), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let rows = null, loading = false, built = false;
  const css = document.createElement('style'); css.textContent = `#openstock .oshd{display:flex;align-items:baseline;gap:12px;margin:2px 0 12px;flex-wrap:wrap}#openstock .oshd h2{font-family:var(--font-anthropic-serif);font-weight:400;font-size:24px;color:var(--navy);margin:0}#openstock .oshd span{font-size:12px;color:var(--mut)}
#openstock .ostr{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:#FFF1D6;color:#8A5A00;border:1px solid #F0D49A;border-radius:3px;padding:2px 7px}
#openstock .osk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}#openstock .osk>div{padding:2px 18px;border-left:1px solid var(--line)}#openstock .osk>div:first-child{border-left:0;padding-left:4px}
#openstock .osk .tl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}#openstock .osk .tv{font-family:var(--font-anthropic-serif);font-size:28px;color:var(--navy);margin-top:4px}#openstock .osk .ts{font-size:11.5px;color:var(--mut)}
#openstock .osbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}#openstock select,#openstock input{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid #D5DBE1;border-radius:4px}#openstock input{min-width:260px}`;
  document.head.appendChild(css);
  /* No viewer restriction here (Umair, 31 Oct): on the portal the tab follows the per-user tab ticks in Users (id "openstock"). */
  const portal = () => window.__PORTAL;
  async function init() {
    const P = portal(); if (P && P.canTab && !P.canTab('openstock')) return;
    const tabs = document.getElementById('tabs'), root = document.getElementById('ael') || document.body; if (!tabs || document.getElementById('t-openstock')) return;
    const b = document.createElement('button'); b.className = 'tab'; b.id = 't-openstock'; b.setAttribute('role', 'tab'); b.dataset.p = 'openstock'; b.textContent = 'Closing Stock'; b.title = 'Month-end closing stock read from the Atlas feeds';
    b.addEventListener('click', ev => { ev.stopPropagation(); open(); }, true); tabs.appendChild(b);
    const sec = document.createElement('section'); sec.className = 'page'; sec.id = 'openstock'; const last = [...root.querySelectorAll('section.page')].pop(); if (last) last.after(sec); else root.appendChild(sec);
    if (location.hash === '#openstock') open();
  }
  function open() { window.__page = 'openstock'; document.querySelectorAll('#ael .page, section.page').forEach(s => s.classList.toggle('on', s.id === 'openstock'));
    document.querySelectorAll('#tabs .tab').forEach(t => t.setAttribute('aria-selected', t.id === 't-openstock' ? 'true' : 'false')); render(); }
  const SRC = ['Atlas portal', 'MB52 list', 'Both'];
  /* Portal: the opening_stock dataset in Supabase (database rules allow it only to users with this tab). Claude artifact: the uploaded file. */
  async function load() {
    const Pt = window.Portal;
    if (portal() && Pt && Pt.sb) { const { data, error } = await Pt.sb.from('datasets').select('data').eq('name', 'opening_stock').maybeSingle(); if (error || !data) throw new Error('no data'); return data.data; }
    return (await fetch('/_blob/' + OS.blob)).json();

  /* Row: [material, description, stock, source, opening, incoming, safety stock, vendor stock, schedule MTD, receipt MTD, production MTD, {day: [schedule, receipt]}] */

.ovm{position:fixed;inset:0;background:rgba(5,28,44,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.ovm .bx{background:#fff;border-radius:8px;border-top:5px solid var(--ac,#051C2C);width:min(1280px,96vw);max-height:92vh;overflow:auto;padding:18px 22px 20px;box-shadow:0 18px 50px rgba(0,0,0,.3);font-family:var(--font-anthropic-sans);color:#051C2C}
.ovm .bh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.ovm h2{font-family:var(--font-anthropic-serif);font-weight:400;font-size:22px;margin:0}
.ovm .bs{font-size:12px;color:#5B6770;margin-top:2px}
.ovm .x{border:1px solid #D5DBE1;background:#fff;border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;cursor:pointer;color:#051C2C;flex:0 0 auto}
.ovm .x:hover{background:#051C2C;color:#fff}
.ovm .bk{display:flex;flex-wrap:wrap;gap:8px 26px;margin:6px 0 12px;padding-bottom:10px;border-bottom:1px solid #EEF1F4}
.ovm .bk .k{border-left:3px solid var(--ac,#051C2C);padding-left:9px}
.ovm .bk .l{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#5B6770}
.ovm .bk .v{font-family:var(--font-anthropic-serif);font-size:22px;font-variant-numeric:tabular-nums}
.ovm .bk .s{font-size:11px;color:#5B6770}
.ovm .bg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px}
.ovm .pn h4{margin:0 0 4px;font-size:13px;font-weight:600}
.ovm .pn .lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:#5A6670;margin-bottom:2px}
.ovm .pn .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ovm .pn .em{color:#5B6770;font-size:12px;padding:30px 0;text-align:center}
.ovm .ft{font-size:11.5px;color:#5B6770;margin-top:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ovm .ft button{border:1px solid #051C2C;background:#051C2C;color:#fff;border-radius:4px;padding:5px 12px;font-size:12px;cursor:pointer}
@media (max-width:1000px){.ael #summary .ovg{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;aspect-ratio:auto;max-height:none}.ael #summary .ovc{height:300px}.ovm .bg{grid-template-columns:1fr}}
.ael #summary .ovc{padding:12px 16px 12px}
.ael #summary .ovc .hd{margin-bottom:10px}
.ael #summary .ovk{flex:0 0 35%;min-width:0;justify-content:flex-start;gap:0}
.ael #summary .ovk .hero{padding-bottom:10px}
.ael #summary .ovk .hero .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#5B6770;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ael #summary .ovk .hero .v{font-family:var(--font-anthropic-serif);font-size:clamp(20px,1.65vw,28px);line-height:1.15;color:#051C2C;font-variant-numeric:tabular-nums;white-space:nowrap}
.ael #summary .ovk .hero .s{font-size:11px;color:#5B6770;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ael #summary .ovk .rows{border-top:1px solid #E2E6EB}
.ael #summary .ovk .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid #EEF1F4;font-size:12px;color:#5B6770}
.ael #summary .ovk .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ael #summary .ovk .r b{font-family:var(--font-anthropic-serif);font-weight:400;font-size:clamp(14px,1.15vw,17px);color:#051C2C;font-variant-numeric:tabular-nums;white-space:nowrap}
.ael #summary .ovv .vt{font-size:10.5px;color:#8A949E;margin-bottom:4px;text-align:right}
.ael #summary .ovb{gap:12px}
.ael #summary .ovv{background:linear-gradient(180deg,#F7F9FB,#fff);border-radius:6px;padding:4px 4px 0}
.ael #summary .ovv .vt{font-size:11px;color:#33414B;font-weight:600;margin:2px 4px 2px}
.ael #summary .ovv .vt{display:flex;justify-content:flex-end;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.ael #summary .ovv .vtt{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ael #summary .tg{font:600 10.5px var(--font-anthropic-sans);border:1px solid #C9D1D9;background:#fff;color:#33414B;border-radius:12px;padding:3px 10px;cursor:pointer;margin-right:auto;white-space:nowrap}
.ael #summary .tg:hover{border-color:#1F9E89;color:#1F9E89}
.ael #summary .tg.on{background:#1F9E89;border-color:#1F9E89;color:#fff}
.ael #summary .tg.on::before{content:'✓ '}`;
