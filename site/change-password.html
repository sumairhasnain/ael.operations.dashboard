<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Change password · AEL Operations Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/portal.js"></script>
</head>
<body>
<main class="main" style="display:flex;justify-content:center;padding:48px 20px">
  <form class="form" id="f" novalidate>
    <h2 id="h">Change password</h2>
    <p class="sub" id="sub">Choose a new password for your portal account.</p>
    <div class="msg" id="m"></div>
    <input type="email" name="username" autocomplete="username" id="user" hidden>
    <div class="field"><label for="cur">Current password</label>
      <div class="pw"><input id="cur" type="password" autocomplete="current-password"><button type="button">Show</button></div></div>
    <div class="field"><label for="n1">New password</label>
      <div class="pw"><input id="n1" type="password" autocomplete="new-password"><button type="button">Show</button></div></div>
    <ul class="rules" id="rules"></ul>
    <div class="field"><label for="n2">Confirm new password</label>
      <div class="pw"><input id="n2" type="password" autocomplete="new-password"><button type="button">Show</button></div></div>
    <button class="btn block" id="go" type="submit">Save new password</button>
    <p style="margin-top:16px" id="back"><a href="app.html">← Back to dashboard</a></p>
  </form>
</main>
<script>
(async () => {
  const P = window.Portal, f = document.getElementById('f'), m = document.getElementById('m');
  const say = (t, cls = '') => { m.className = 'msg ' + cls; m.textContent = t; };
  P.pwToggle(f);
  if (!P.configured) { P.notConfigured(m); return; }
  const prof = await P.guard({ allowMustChange: true }); if (!prof) return;
  const first = prof.must_change_password;
  document.getElementById('user').value = prof.email;
  if (first) {
    document.getElementById('h').textContent = 'Set your own password';
    document.getElementById('sub').textContent = `Welcome${prof.full_name ? ', ' + prof.full_name.split(' ')[0] : ''}. Before you open the dashboard, replace the temporary password you were given with one only you know.`;
    document.querySelector('label[for=cur]').textContent = 'Temporary password';
    document.getElementById('back').innerHTML = '<button type="button" class="link" id="lo">Sign out</button>';
    document.getElementById('lo').onclick = () => P.signOut();
  } else {
    P.topbar(prof, 'pw');
  }
  const rules = document.getElementById('rules');
  const paint = () => { rules.innerHTML = P.pwChecks(f.n1.value, prof.email).map(([t, ok]) => `<li class="${ok ? 'ok' : ''}">${t}</li>`).join(''); };
  f.n1.addEventListener('input', paint); paint();

  f.onsubmit = async ev => {
    ev.preventDefault();
    const cur = f.cur.value, n1 = f.n1.value, n2 = f.n2.value;
    if (!cur) { say('Enter your current password.', 'bad'); return; }
    if (P.pwChecks(n1, prof.email).some(([, ok]) => !ok)) { say('The new password does not meet the rules below it.', 'bad'); return; }
    if (n1 !== n2) { say('The two new passwords do not match.', 'bad'); return; }
    if (n1 === cur) { say('The new password must be different from the current one.', 'bad'); return; }
    const b = document.getElementById('go'); b.disabled = true; b.textContent = 'Saving…';
    // confirm the current password first, so an unattended open session cannot be hijacked
    const chk = await P.sb.auth.signInWithPassword({ email: prof.email, password: cur });
    if (chk.error) { b.disabled = false; b.textContent = 'Save new password'; say('Current password is incorrect.', 'bad'); return; }
    const { error } = await P.sb.auth.updateUser({ password: n1 });
    if (error) { b.disabled = false; b.textContent = 'Save new password'; say(error.message, 'bad'); return; }
    await P.log('password_changed');
    say('Password changed.', 'good');
    setTimeout(() => P.go('app.html'), 700);
  };
})();
</script>
</body>
</html>
